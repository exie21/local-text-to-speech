name: edspeech

services:
  backend:
    build:
      context: ./backend
    environment:
      MODEL_DIR: /app/models
      TEMP_DIR: /app/data/temp
      DATABASE_DIR: /app/data/database
      TTS_THREADS: ${TTS_THREADS:-2}
      TTS_CHUNK_SIZE: ${TTS_CHUNK_SIZE:-800}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-100000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10000000}
      AUDIO_TTL_MINUTES: ${AUDIO_TTL_MINUTES:-30}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${MODEL_DIR:-./models}
        target: /app/models
        read_only: true
      - type: bind
        source: ${TEMP_DIR:-./data/temp}
        target: /app/data/temp
      - type: bind
        source: ${DATABASE_DIR:-./data/database}
        target: /app/data/database

  frontend:
    build:
      context: ./frontend
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
